name: Build and Publish Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # cgo type-checking needs only the header; tdjson_export.h is CMake-generated, so stub it
      - name: Vet with tdlib tag
        run: |
          commit=$(sed -n 's/^ARG TDLIB_COMMIT=//p' Dockerfile)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "bad TDLIB_COMMIT: $commit"; exit 1; }
          mkdir -p "$RUNNER_TEMP/tdinc/td/telegram"
          curl -fsSL "https://raw.githubusercontent.com/tdlib/td/${commit}/td/telegram/td_json_client.h" \
            -o "$RUNNER_TEMP/tdinc/td/telegram/td_json_client.h"
          echo '#define TDJSON_EXPORT' > "$RUNNER_TEMP/tdinc/td/telegram/tdjson_export.h"
          CGO_CFLAGS="-I$RUNNER_TEMP/tdinc" go vet -tags=tdlib ./...

  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # latest tag for default branch
            type=raw,value=latest,enable={{is_default_branch}}
            # short sha
            type=sha,prefix=,format=short
            # full sha
            type=sha,prefix=,format=long
            # semver tags (v1.2.3 -> 1.2.3, 1.2, 1)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
